name: Test properties configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          githubServer: "false"
          properties: '[{"myProperty1": "myValue1"}, {"myProperty2": "myValue2"}]'
      - name: Assert settings.xml was created
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists"
      - name: Assert settings.xml contains properties
        run: |
          SETTINGS="$HOME/.m2/settings.xml"
          echo "Contents of settings.xml:"
          cat "$SETTINGS"
          if ! grep -q "myProperty1" "$SETTINGS"; then
            echo "FAIL: settings.xml does not contain 'myProperty1'"
            exit 1
          fi
          if ! grep -q "myValue1" "$SETTINGS"; then
            echo "FAIL: settings.xml does not contain 'myValue1'"
            exit 1
          fi
          if ! grep -q "myProperty2" "$SETTINGS"; then
            echo "FAIL: settings.xml does not contain 'myProperty2'"
            exit 1
          fi
          if ! grep -q "myValue2" "$SETTINGS"; then
            echo "FAIL: settings.xml does not contain 'myValue2'"
            exit 1
          fi
          echo "PASS: settings.xml contains all properties"
