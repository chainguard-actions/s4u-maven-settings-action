name: Test custom path for settings.xml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom directory
        run: mkdir -p /tmp/custom-maven
      - id: action
        uses: .
        with:
          path: /tmp/custom-maven/settings.xml
          githubServer: "false"
      - name: Assert settings.xml was created at custom path
        run: |
          SETTINGS="/tmp/custom-maven/settings.xml"
          echo "Checking for settings.xml at: $SETTINGS"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.xml not found at custom path $SETTINGS"
            exit 1
          fi
          echo "PASS: settings.xml exists at custom path"
      - name: Assert settings.xml is valid XML at custom path
        run: |
          SETTINGS="/tmp/custom-maven/settings.xml"
          echo "Contents of settings.xml:"
          cat "$SETTINGS"
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$SETTINGS')
          root = tree.getroot()
          print('Root tag:', root.tag)
          " || {
            echo "FAIL: settings.xml at custom path is not valid XML"
            exit 1
          }
          echo "PASS: settings.xml at custom path is valid XML"
